<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tonic — Live Key &amp; Chord Detection</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 15v-6M8.5 18v-12M13 20v-16M17.5 18v-12M21 15v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <h1>Tonic</h1>
        <span class="debug-badge" id="debug-badge" hidden>debug</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="Mode">
        <button type="button" class="tab active" role="tab" aria-selected="true" data-view="live" id="tab-live">
          <span class="live-dot" id="live-status-dot" aria-hidden="true"></span>Live
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-view="file" id="tab-file">File</button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-view="sets" id="tab-sets">Sets</button>
      </nav>
    </header>

    <main class="views">
      <section class="view active" id="view-live" role="tabpanel" aria-labelledby="tab-live">
        <div class="results" id="live-results"></div>
      </section>
      <section class="view" id="view-file" role="tabpanel" aria-labelledby="tab-file" hidden>
        <div class="results" id="file-results"></div>
        <input type="file" id="file-input" accept=".wav,.mp3,audio/wav,audio/mpeg" hidden />
      </section>
      <section class="view" id="view-sets" role="tabpanel" aria-labelledby="tab-sets" hidden>
        <div class="sets">
          <div class="sets-head">
            <button type="button" class="set-picker program-btn" id="program-picker" aria-haspopup="listbox" aria-expanded="false" aria-controls="program-menu"></button>
            <input class="set-picker-input" id="program-name-input" type="text" maxlength="60" aria-label="Program name" hidden />
            <button type="button" class="pill-btn" id="program-edit" aria-pressed="false">Edit</button>
            <button type="button" class="pill-btn" id="program-new">+ Program</button>
          </div>
          <div class="program-menu" id="program-menu" hidden>
            <div class="program-menu-tools">
              <input class="program-search" id="program-search" type="search" placeholder="Search programs" aria-label="Search programs" autocomplete="off" />
              <button type="button" class="pill-btn small" id="program-sort" aria-label="Sort programs"></button>
            </div>
            <ul class="program-list" id="program-list" role="listbox" aria-label="Programs"></ul>
          </div>

          <div class="sets-sub">
            <span class="label sets-count" id="program-count"></span>
            <button type="button" class="pill-btn small" id="set-add-top">+ Set</button>
            <nav class="set-jumps" id="set-jumps" aria-label="Jump to set"></nav>
            <button type="button" class="pill-btn danger" id="program-delete" hidden>Delete program</button>
            <button type="button" class="pill-btn small level-cycle" id="set-level" aria-label="Chords shown per song (tap to change)"></button>
          </div>

          <div class="set-sections" id="set-sections"></div>

          <form class="song-add" id="song-add">
            <input class="song-add-title" id="song-add-title" type="text" maxlength="80" placeholder="Song title" aria-label="Song title" autocomplete="off" />
            <select class="key-select" id="song-add-key" aria-label="Key"></select>
            <button type="submit" class="pill-btn primary">Add</button>
          </form>
        </div>
      </section>
    </main>

    <!-- Chord sheet for one song (lyrics + chords, follows the song's key). -->
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <header class="sheet-head">
        <button type="button" class="icon-btn" id="sheet-back" aria-label="Back">←</button>
        <div class="sheet-titles">
          <h2 class="sheet-title" id="sheet-title"></h2>
          <p class="sheet-sub" id="sheet-sub"></p>
        </div>
        <div class="song-key" id="sheet-key"></div>
      </header>
      <div class="sheet-body" id="sheet-body"></div>
      <div class="sheet-foot" id="sheet-foot">
        <button type="button" class="pill-btn" id="sheet-edit">Edit sheet</button>
      </div>
      <form class="sheet-editor" id="sheet-editor" hidden>
        <div class="sheet-hint-row">
          <p class="sheet-hint">Paste the part you perform: chords above the lyrics, or chords in brackets like <b>[G]Tum hi [D]ho</b>.</p>
          <button type="button" class="pill-btn small" id="sheet-find">Find chords ↗</button>
        </div>
        <textarea class="sheet-text" id="sheet-text" spellcheck="false" autocomplete="off" aria-label="Chord sheet"></textarea>
        <div class="sheet-editor-bar">
          <label class="sheet-written">Chords written in
            <select class="key-select" id="sheet-written" aria-label="Key the pasted chords are written in"></select>
          </label>
          <button type="button" class="pill-btn" id="sheet-cancel">Cancel</button>
          <button type="submit" class="pill-btn primary">Save</button>
        </div>
      </form>
    </section>

    <!-- Text shared into the app: pick which song it's the chord sheet for. -->
    <section class="sheet share-pick" id="share-pick" role="dialog" aria-modal="true" aria-labelledby="share-title" hidden>
      <header class="sheet-head">
        <button type="button" class="icon-btn" id="share-back" aria-label="Cancel">←</button>
        <div class="sheet-titles">
          <h2 class="sheet-title" id="share-title">Which song is this for?</h2>
          <p class="sheet-sub" id="share-sub"></p>
        </div>
      </header>
      <pre class="share-preview" id="share-preview"></pre>
      <select class="set-picker share-program" id="share-program" aria-label="Program"></select>
      <div class="share-list" id="share-list"></div>
      <form class="song-add share-new" id="share-new">
        <input class="song-add-title" id="share-new-title" type="text" maxlength="80" placeholder="Or a new song: title" aria-label="New song title" autocomplete="off" />
        <button type="submit" class="pill-btn primary">Add</button>
      </form>
    </section>

    <footer class="dock">
      <p class="status" id="status" aria-live="polite"></p>
      <div class="dock-row">
        <button type="button" class="dock-toggle" id="toggle-notes" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 19V13M9.5 19V8M14 19V11M18.5 19V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span>Notes</span>
        </button>

        <button type="button" class="main-btn" id="live-toggle" aria-label="Start listening">
          <svg class="ico ico-mic" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.9" />
            <path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          </svg>
          <svg class="ico ico-stop" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" />
          </svg>
          <svg class="ico ico-plus" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
          <svg class="ico ico-check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg class="ico ico-upload" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15V5m0 0 4 4m-4-4-4 4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          </svg>
        </button>

        <button type="button" class="dock-toggle" id="toggle-chords" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="4" y="4" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8" />
            <rect x="13" y="4" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8" />
            <rect x="4" y="13" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8" />
            <rect x="13" y="13" width="7" height="7" rx="2" stroke="currentColor" stroke-width="1.8" />
          </svg>
          <span>Chords</span>
        </button>
      </div>
    </footer>
  </div>

  <template id="result-template">
    <div class="hero">
      <div class="chord-now idle" data-field="currentChordBlock">
        <div class="label" data-field="nowLabel">Playing now</div>
        <div class="chord-now-value" data-field="currentChordValue">—</div>
        <div class="chord-now-tones" data-field="currentChordTones"></div>
      </div>
      <div class="key-now" data-field="scaleBlock">
        <div class="label">Key</div>
        <div class="key-value" data-field="topScale">—</div>
        <div class="key-meter">
          <div class="meter-track"><div class="meter-fill" data-field="confidenceFill"></div></div>
          <span class="meter-value" data-field="confidenceLabel"></span>
        </div>
      </div>
    </div>

    <div class="notes-block" data-field="notesBlock" hidden>
      <ol class="note-strip" data-field="noteStrip"></ol>
    </div>

    <div class="fifths-block">
      <div class="fifths-wrap" data-field="fifthsWrap"></div>
      <p class="fifths-caption" data-field="fifthsCaption"></p>
    </div>

    <div class="chords-block" data-field="chordsBlock">
      <div class="block-head">
        <div class="label">Chords in key</div>
        <div class="levels" role="tablist" aria-label="How many chords">
          <button type="button" class="level-tab" data-level="easy">Easy</button>
          <button type="button" class="level-tab" data-level="medium">Med</button>
          <button type="button" class="level-tab" data-level="hard">Hard</button>
          <button type="button" class="level-tab" data-level="full">All</button>
        </div>
      </div>
      <ol class="chord-row" data-field="chords"></ol>
    </div>

    <p class="similar" data-field="similarBlock"><span class="label">Also</span> <span data-field="similar">—</span></p>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
